<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTS – Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10243a; --ink-soft:#4b6178; --paper:#f3f6f9; --card:#ffffff;
    --line:#d5dee7; --cobalt:#1f5fd6; --cobalt-dark:#1748a8; --signal:#e8590c;
    --ok:#177a4b; --err:#b42318; --panel:#10243a; --panel-text:#dbe6f1;
    --radius:8px;
    --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --serif:"Fraunces",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.5;-webkit-font-smoothing:antialiased}
  :focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
  [hidden]{display:none!important}

  .shell{min-height:100%;display:grid;grid-template-columns:minmax(300px,5fr) 7fr}
  .side{background:var(--panel);color:var(--panel-text);padding:48px 44px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
  .brand{font-family:var(--serif);font-size:30px;color:#fff;letter-spacing:.2px}
  .side h2{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.2;color:#fff;max-width:14ch}
  .side p{max-width:36ch;margin-top:14px;color:#a9bdd0}
  .server{border:1px solid #2c4560;border-radius:var(--radius);padding:18px 20px;font-size:14px}
  .server dl{display:grid;grid-template-columns:auto 1fr;gap:8px 20px}
  .server dt{color:#8ea6bd}
  .server dd{color:#fff;word-break:break-all}
  .live{display:inline-flex;align-items:center;gap:8px;margin-bottom:12px;color:#fff;font-weight:500}
  .dot{width:9px;height:9px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 0 rgba(61,220,132,.6);animation:pulse 2s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 9px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}

  .main{display:grid;place-items:center;padding:32px 20px}
  .card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:36px 32px}
  .card.wide{max-width:640px}
  h1{font-family:var(--serif);font-size:28px;font-weight:600;margin-bottom:6px}
  .sub{color:var(--ink-soft);margin-bottom:24px}
  label{display:block;font-weight:500;font-size:14px;margin:16px 0 6px}
  .field{position:relative}
  input[type=email],input[type=password],input[type=text]{
    width:100%;padding:11px 12px;font:inherit;color:var(--ink);background:#fff;
    border:1px solid #9fb0c1;border-radius:6px}
  input:focus{border-color:var(--cobalt)}
  input[aria-invalid=true]{border-color:var(--err)}
  .toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;
    color:var(--cobalt);font:inherit;font-size:13px;font-weight:500;padding:6px 8px;cursor:pointer;border-radius:4px}
  .hint{font-size:13px;color:var(--ink-soft);margin-top:6px}
  .fielderr{font-size:13px;color:var(--err);margin-top:6px;min-height:0}
  .row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:14px}
  .row label{display:flex;align-items:center;gap:8px;margin:0;font-weight:400}
  button.primary{width:100%;margin-top:24px;padding:12px;font:inherit;font-weight:600;color:#fff;
    background:var(--cobalt);border:0;border-radius:6px;cursor:pointer}
  button.primary:hover{background:var(--cobalt-dark)}
  button.primary:disabled{opacity:.6;cursor:progress}
  button.ghost{padding:10px 16px;font:inherit;font-weight:500;color:var(--ink);background:#fff;border:1px solid #9fb0c1;border-radius:6px;cursor:pointer}
  button.ghost:hover{background:var(--paper)}
  a{color:var(--cobalt);font-weight:500}
  .switch{margin-top:22px;text-align:center;font-size:14px;color:var(--ink-soft)}
  .alert{margin-bottom:16px;padding:10px 12px;border-radius:6px;font-size:14px;border:1px solid}
  .alert.err{background:#fef3f2;border-color:#f4b8b3;color:var(--err)}
  .alert.ok{background:#ecfdf3;border-color:#a6e0c0;color:var(--ok)}
  .meter{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
  .meter i{display:block;height:100%;width:0;background:var(--err);transition:width .2s,background .2s}

  .dash-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  .stat{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
  .stat span{display:block;font-size:13px;color:var(--ink-soft)}
  .stat b{display:block;font-size:18px;margin-top:2px;word-break:break-word}

  @media (max-width:820px){
    .shell{grid-template-columns:1fr}
    .side{padding:28px 24px;gap:20px}
    .side h2{font-size:26px}
    .server{display:none}
  }
  @media (prefers-reduced-motion:reduce){.dot{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div>
      <div class="brand">BTS</div>
    </div>
    <div>
      <h2>Your team’s workspace, one sign-in away.</h2>
      <p>Sign in to see your dashboard. New here? Create an account in under a minute.</p>
    </div>
    <div class="server" aria-label="Server information">
      <div class="live"><span class="dot"></span>Served from this host</div>
      <dl>
        <dt>Host</dt><dd id="s-host"></dd>
        <dt>Protocol</dt><dd id="s-proto"></dd>
        <dt>Local time</dt><dd id="s-time"></dd>
      </dl>
    </div>
  </aside>

  <main class="main" id="app" tabindex="-1"></main>
</div>

<script>
(() => {
  "use strict";

  /* ---------- storage helpers (demo only: browser storage) ---------- */
  const USERS_KEY = "harbor.users";
  const SESSION_KEY = "harbor.session";
  const read = (store, key, fallback) => { try { return JSON.parse(store.getItem(key)) ?? fallback; } catch { return fallback; } };
  const write = (store, key, val) => { try { store.setItem(key, JSON.stringify(val)); } catch {} };

  async function hash(text) {
    if (window.crypto && crypto.subtle) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
    }
    return btoa(unescape(encodeURIComponent(text))); // fallback on plain-http hosts
  }

  async function seed() {
    const users = read(localStorage, USERS_KEY, []);
    if (!users.some(u => u.email === "demo@harbor.app")) {
      users.push({ name: "Demo User", email: "demo@harbor.app", pass: await hash("Demo@1234"), created: Date.now() });
      write(localStorage, USERS_KEY, users);
    }
  }

  const getSession = () => read(sessionStorage, SESSION_KEY, null) || read(localStorage, SESSION_KEY, null);
  const clearSession = () => { sessionStorage.removeItem(SESSION_KEY); localStorage.removeItem(SESSION_KEY); };

  /* ---------- tiny helpers ---------- */
  const $ = (sel, root = document) => root.querySelector(sel);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const emailOk = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
  const app = $("#app");

  /* ---------- views ---------- */
  function passwordField(id, label, autocomplete) {
    return `
      <label for="${id}">${label}</label>
      <div class="field">
        <input id="${id}" type="password" autocomplete="${autocomplete}" required>
        <button type="button" class="toggle" data-toggle="${id}" aria-label="Show password">Show</button>
      </div>`;
  }

  function loginView(notice) {
    document.title = "Harbor – Sign in";
    app.innerHTML = `
      <section class="card" aria-labelledby="h">
        <h1 id="h">Sign in</h1>
        <p class="sub">Use your email and password to continue.</p>
        ${notice ? `<div class="alert ok" role="status">${esc(notice)}</div>` : ""}
        <div id="msg" role="alert"></div>
        <form id="f" novalidate>
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="username" required>
          ${passwordField("pw", "Password", "current-password")}
          <div class="row">
            <label><input type="checkbox" id="remember"> Keep me signed in</label>
          </div>
          <button class="primary" type="submit">Sign in</button>
        </form>
        <p class="switch">No account yet? <a href="#/register">Create one</a></p>
        <p class="hint" style="text-align:center;margin-top:14px">Demo: demo@harbor.app / Demo@1234</p>
      </section>`;
    $("#email").focus();

    $("#f").addEventListener("submit", async e => {
      e.preventDefault();
      const email = $("#email").value.trim().toLowerCase();
      const pw = $("#pw").value;
      const msg = $("#msg");
      msg.innerHTML = "";
      if (!emailOk(email) || !pw) {
        msg.innerHTML = `<div class="alert err">Enter a valid email and your password.</div>`;
        return;
      }
      const btn = $("button.primary"); btn.disabled = true; btn.textContent = "Signing in…";
      const users = read(localStorage, USERS_KEY, []);
      const user = users.find(u => u.email === email);
      const ok = user && user.pass === await hash(pw);
      await new Promise(r => setTimeout(r, 400));
      if (!ok) {
        btn.disabled = false; btn.textContent = "Sign in";
        msg.innerHTML = `<div class="alert err">Email or password is incorrect. Check both and try again.</div>`;
        $("#pw").value = ""; $("#pw").focus();
        return;
      }
      const session = { name: user.name, email: user.email, at: Date.now() };
      write($("#remember").checked ? localStorage : sessionStorage, SESSION_KEY, session);
      location.hash = "#/dashboard";
    });
  }

  function registerView() {
    document.title = "Harbor – Create account";
    app.innerHTML = `
      <section class="card" aria-labelledby="h">
        <h1 id="h">Create your account</h1>
        <p class="sub">It takes less than a minute.</p>
        <div id="msg" role="alert"></div>
        <form id="f" novalidate>
          <label for="name">Full name</label>
          <input id="name" type="text" autocomplete="name" required>
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required>
          ${passwordField("pw", "Password", "new-password")}
          <div class="meter" aria-hidden="true"><i id="bar"></i></div>
          <p class="hint" id="strength">Use 8+ characters with upper and lower case, a number and a symbol.</p>
          ${passwordField("pw2", "Confirm password", "new-password")}
          <button class="primary" type="submit">Create account</button>
        </form>
        <p class="switch">Already registered? <a href="#/login">Sign in</a></p>
      </section>`;
    $("#name").focus();

    $("#pw").addEventListener("input", e => {
      const v = e.target.value;
      const score = [v.length >= 8, /[a-z]/.test(v) && /[A-Z]/.test(v), /\d/.test(v), /[^A-Za-z0-9]/.test(v)].filter(Boolean).length;
      const labels = ["Too weak", "Weak", "Fair", "Good", "Strong"];
      const colors = ["#b42318", "#b42318", "#e8590c", "#c79100", "#177a4b"];
      $("#bar").style.width = (v ? Math.max(score, 1) * 25 : 0) + "%";
      $("#bar").style.background = colors[score];
      $("#strength").textContent = v ? "Strength: " + labels[score] : "Use 8+ characters with upper and lower case, a number and a symbol.";
    });

    $("#f").addEventListener("submit", async e => {
      e.preventDefault();
      const name = $("#name").value.trim();
      const email = $("#email").value.trim().toLowerCase();
      const pw = $("#pw").value, pw2 = $("#pw2").value;
      const msg = $("#msg");
      const fail = t => { msg.innerHTML = `<div class="alert err">${esc(t)}</div>`; };
      msg.innerHTML = "";
      if (name.length < 2) return fail("Enter your full name.");
      if (!emailOk(email)) return fail("Enter a valid email address.");
      if (!(pw.length >= 8 && /[a-z]/.test(pw) && /[A-Z]/.test(pw) && /\d/.test(pw) && /[^A-Za-z0-9]/.test(pw)))
        return fail("Password needs 8+ characters with upper and lower case, a number and a symbol.");
      if (pw !== pw2) return fail("Passwords don’t match. Re-enter them.");
      const users = read(localStorage, USERS_KEY, []);
      if (users.some(u => u.email === email)) return fail("An account with this email already exists. Sign in instead.");
      users.push({ name, email, pass: await hash(pw), created: Date.now() });
      write(localStorage, USERS_KEY, users);
      location.hash = "#/login";
      loginView("Account created. Sign in to continue.");
    });
  }

  function dashboardView(session) {
    document.title = "Harbor – Dashboard";
    const first = session.name.split(" ")[0];
    const signedIn = new Date(session.at).toLocaleString();
    app.innerHTML = `
      <section class="card wide" aria-labelledby="h">
        <div class="dash-head">
          <div>
            <h1 id="h">Welcome, ${esc(first)}</h1>
            <p class="sub" style="margin-bottom:0">You’re signed in as ${esc(session.email)}.</p>
          </div>
          <button class="ghost" id="out">Sign out</button>
        </div>
        <div class="stats">
          <div class="stat"><span>Signed in at</span><b>${esc(signedIn)}</b></div>
          <div class="stat"><span>Session type</span><b>${localStorage.getItem(SESSION_KEY) ? "Persistent" : "This tab only"}</b></div>
          <div class="stat"><span>Served from</span><b>${esc(location.host || "local file")}</b></div>
        </div>
      </section>`;
    $("#h").parentElement.setAttribute("tabindex", "-1");
    $("#out").addEventListener("click", () => { clearSession(); location.hash = "#/login"; });
  }

  /* ---------- router ---------- */
  function route() {
    const path = (location.hash || "#/login").replace("#", "");
    const session = getSession();
    if (path === "/dashboard") return session ? dashboardView(session) : (location.hash = "#/login");
    if (session) return (location.hash = "#/dashboard");
    if (path === "/register") return registerView();
    return loginView();
  }

  document.addEventListener("click", e => {
    const t = e.target.closest("[data-toggle]");
    if (!t) return;
    const input = document.getElementById(t.dataset.toggle);
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    t.textContent = show ? "Hide" : "Show";
    t.setAttribute("aria-label", show ? "Hide password" : "Show password");
  });

  window.addEventListener("hashchange", route);

  /* ---------- server info panel ---------- */
  $("#s-host").textContent = location.host || "local file";
  $("#s-proto").textContent = location.protocol.replace(":", "").toUpperCase() || "FILE";
  const tick = () => { $("#s-time").textContent = new Date().toLocaleTimeString(); };
  tick(); setInterval(tick, 1000);

  seed().then(route);
})();
</script>
</body>
</html>
